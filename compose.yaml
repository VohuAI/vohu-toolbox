services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: ${CONTAINER_NAME:-vllm}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    ipc: host
    gpus: all
    stop_grace_period: 60s
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_CACHE_ROOT: /root/.cache/vllm
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/vllm:/root/.cache/vllm
      - ./models:/models:ro
    command:
      - --host
      - ${VLLM_HOST:-0.0.0.0}

      - --port
      - ${VLLM_PORT:-8000}

      - --api-key
      - ${VLLM_API_KEY:?Set VLLM_API_KEY in .env}


      - --max-num-seqs
      - ${MODEL_MAX_NUM_SEQS:-1}

      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.85}

      - --model
      - ${MODEL_NAME:-Qwen/Qwen3-8B-AWQ}
      
      - --served-model-name
      - ${MODEL_SERVED_NAME:-local-model}

      - --dtype
      - ${MODEL_DTYPE:-half}

      - --max-model-len
      - ${MODEL_MAX_MODEL_LEN:-16384}

      - --quantization
      - ${MODEL_QUANTIZATION:-awq}

      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

